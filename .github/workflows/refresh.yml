name: Refresh snow data

on:
  schedule:
    - cron: "40 12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [page.html, fetch_snapshot.py, build.py]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch Open-Meteo + SkiCentral and rebuild the page
        run: |
          python3 -I fetch_snapshot.py snapshot.json
          python3 build.py
      - name: Commit the refreshed page
        run: |
          git config user.name "pow-bot"
          git config user.email "pow-bot@users.noreply.github.com"
          git add index.html snapshot.json
          git diff --cached --quiet || git commit -m "Refresh snow data $(date -u +%Y-%m-%d)"
          git push
